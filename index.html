<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mini Manim Recorder</title>

<!-- MathJax -->
<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(','\\)']]
  },
  svg: {
    fontCache: 'global'
  }
};
</script>

<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

<!-- html2canvas -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas"></script>

<!-- CCapture -->
<script src="https://cdn.jsdelivr.net/npm/ccapture.js-npmfixed/build/CCapture.all.min.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

/* BUTTON */
#startBtn{

  position:fixed;

  top:20px;
  left:20px;

  z-index:99999;

  padding:14px 24px;

  border:none;
  border-radius:12px;

  background:#ffffff;

  color:#000;

  font-size:18px;
  font-weight:bold;

  cursor:pointer;

  box-shadow:
    0 0 10px rgba(255,255,255,.5);

}

/* SCENE */
#scene{

  position:relative;

  width:1280px;
  height:720px;

  overflow:hidden;

  background:
    radial-gradient(circle,#1f1f1f,#000);

  transform-origin:top left;

}

/* CAMERA */
#camera{

  position:absolute;

  width:100%;
  height:100%;

  transition:
    transform 2s ease;

}

/* OBJECT */
.object{

  position:absolute;

  left:50%;
  top:50%;

  color:white;

  font-size:64px;
  font-weight:bold;

  opacity:0;

  transform:
    translate(-50%,-50%)
    scale(.5);

  filter:
    blur(20px);

  transition:
    opacity 2s ease,
    transform 2s ease,
    filter 2s ease;

  text-shadow:
    0 0 10px white,
    0 0 20px white,
    0 0 40px white;

}

/* SHOW */
.show{

  opacity:1;

  transform:
    translate(-50%,-50%)
    scale(1);

  filter:
    blur(0px);

}

/* PARTICLES */
.particle{

  position:absolute;

  width:4px;
  height:4px;

  border-radius:50%;

  background:white;

  opacity:.3;

  animation:
    float linear infinite;

}

@keyframes float{

  from{
    transform:
      translateY(720px);
  }

  to{
    transform:
      translateY(-100px);
  }

}

</style>
</head>
<body>

<button id="startBtn">
START & DOWNLOAD VIDEO
</button>

<div id="scene">
  <div id="camera"></div>
</div>

<script>

const scene =
  document.getElementById("scene");

const camera =
  document.getElementById("camera");

const startBtn =
  document.getElementById("startBtn");

/* SCALE */
function resize(){

  const scaleX =
    window.innerWidth / 1280;

  const scaleY =
    window.innerHeight / 720;

  const scale =
    Math.min(scaleX,scaleY);

  scene.style.transform =
    `scale(${scale})`;

}

resize();

window.addEventListener(
  "resize",
  resize
);

/* PARTICLES */
for(let i=0;i<100;i++){

  const p =
    document.createElement("div");

  p.className =
    "particle";

  p.style.left =
    Math.random()*1280+"px";

  p.style.top =
    Math.random()*720+"px";

  p.style.animationDuration =
    5 + Math.random()*10 + "s";

  scene.appendChild(p);

}

/* LATEX */
function latex(t){
  return `\\(${t}\\)`;
}

/* CREATE TEXT */
function createText(content){

  const div =
    document.createElement("div");

  div.className =
    "object";

  div.innerHTML =
    latex(content);

  camera.appendChild(div);

  return div;

}

/* SLEEP */
function sleep(ms){

  return new Promise(
    r=>setTimeout(r,ms)
  );

}

/* RECORD FRAME */
async function recordFrame(capturer){

  const canvas =
    await html2canvas(scene,{

      backgroundColor:null,

      useCORS:true

    });

  capturer.capture(canvas);

}

/* ANIMATION */
async function animateText(
  capturer,
  oldObj,
  content,
  options={}
){

  const {

    wait=3000,

    zoom=1,

    scale=1

  } = options;

  /* CAMERA */
  camera.style.transform =
    `scale(${zoom})`;

  /* REMOVE OLD */
  if(oldObj){

    oldObj.style.opacity =
      "0";

    oldObj.style.transform =
      `
      translate(-50%,-50%)
      scale(1.5)
      `;

    oldObj.style.filter =
      "blur(30px)";

  }

  await sleep(2000);

  /* NEW OBJECT */
  const obj =
    createText(content);

  obj.style.transform =
    `
    translate(-50%,-50%)
    scale(${scale*.5})
    `;

  await MathJax.typesetPromise([obj]);

  requestAnimationFrame(()=>{

    obj.classList.add("show");

    obj.style.transform =
      `
      translate(-50%,-50%)
      scale(${scale})
      `;

  });

  /* RECORD */
  const frames =
    wait / 1000 * 60;

  for(let i=0;i<frames;i++){

    await recordFrame(capturer);

    await sleep(1000/60);

  }

  return obj;

}

/* START BUTTON */
startBtn.onclick = async()=>{

  startBtn.disabled = true;

  startBtn.innerText =
    "RENDERING VIDEO...";

  /* CAPTURER */
  const capturer =
    new CCapture({

      format:"webm",

      framerate:60,

      verbose:true

    });

  capturer.start();

  let current = null;

  /* TITLE */
  current =
  await animateText(

    capturer,

    current,

    "\\text{Deret Geometri}",

    {

      wait:4000,

      zoom:1.1,

      scale:1.2

    }

  );

  /* STEP 1 */
  current =
  await animateText(

    capturer,

    current,

    "S_n = a + ar + ar^2 + \\cdots + ar^{n-1}",

    {

      wait:4000,

      zoom:1.15

    }

  );

  /* STEP 2 */
  current =
  await animateText(

    capturer,

    current,

    "S_n = a + r(a + ar + ar^2 + \\cdots + ar^{n-2})",

    {

      wait:4000,

      zoom:1.2

    }

  );

  /* STEP 3 */
  current =
  await animateText(

    capturer,

    current,

    "S_n = a + r(S_n-ar^{n-1})",

    {

      wait:4000,

      zoom:1.25

    }

  );

  /* STEP 4 */
  current =
  await animateText(

    capturer,

    current,

    "S_n = a + rS_n-ar^n",

    {

      wait:4000,

      zoom:1.3

    }

  );

  /* STEP 5 */
  current =
  await animateText(

    capturer,

    current,

    "S_n-rS_n = a-ar^n",

    {

      wait:4000,

      zoom:1.35

    }

  );

  /* STEP 6 */
  current =
  await animateText(

    capturer,

    current,

    "(1-r)S_n = a-ar^n",

    {

      wait:4000,

      zoom:1.4

    }

  );

  /* FINAL */
  current =
  await animateText(

    capturer,

    current,

    "S_n = \\frac{a(1-r^n)}{1-r}",

    {

      wait:7000,

      zoom:1.5,

      scale:1.3

    }

  );

  /* FINAL GLOW */
  current.style.textShadow =
  `
  0 0 20px #fff,
  0 0 40px #fff,
  0 0 80px #fff,
  0 0 120px #fff
  `;

  /* LAST RECORD */
  for(let i=0;i<180;i++){

    await recordFrame(capturer);

    await sleep(1000/60);

  }

  /* STOP */
  capturer.stop();

  startBtn.innerText =
    "DOWNLOADING...";

  capturer.save();

  startBtn.innerText =
    "DONE";

};

</script>

</body>
</html>
